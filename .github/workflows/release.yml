name: Publish to NPM

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org/'
      # OIDC trusted publishing needs a recent npm (>= 11.5.1). Node 20 ships an
      # older one, so upgrade before publishing.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm run build:mcp
      - run: npm run check:package
      - run: npm run check:setup
      - run: npm run check:smoke
      # No NODE_AUTH_TOKEN: npm authenticates via GitHub OIDC against the
      # trusted publisher configured for this package, and emits provenance.
      - run: npm publish --provenance --access public
