name: Publish to NPM

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org/'
      # OIDC trusted publishing needs a recent npm (>= 11.5.1). Node 20 ships an
      # older one, so upgrade before publishing.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm run check:setup
      - run: npm run check:smoke
      # No NODE_AUTH_TOKEN: npm authenticates via GitHub OIDC against the
      # trusted publisher configured for this package, and emits provenance.
      - run: npm publish --provenance --access public
