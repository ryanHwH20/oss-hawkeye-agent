name: PR Validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Build and Validation Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check agent skill copies
        run: npm run check:skills

      - name: Build
        run: npm run build

      - name: Package VS Code extension
        run: npm run package:vscode

      - name: Bundle MCP adapter
        run: npm run build:mcp

      - name: Check npm package contents
        run: npm run check:package

      - name: Unit tests
        run: npm test

      - name: Setup checks
        run: npm run check:setup

      - name: Smoke checks
        run: npm run check:smoke
