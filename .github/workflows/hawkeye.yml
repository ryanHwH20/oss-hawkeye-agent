name: PR Validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Build and Validation Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check agent skill copies
        run: npm run check:skills

      - name: Build
        run: npm run build

      - name: Package VS Code extension
        run: npm run package:vscode

      - name: Bundle MCP adapter
        run: npm run build:mcp

      - name: Check npm package contents
        run: npm run check:package

      - name: Unit tests
        run: npm test

      - name: Setup checks
        run: npm run check:setup

      - name: Smoke checks
        run: npm run check:smoke
