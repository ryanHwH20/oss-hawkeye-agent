name: PR Validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Build and Validation Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup checks
        run: npm run check:setup

      - name: Smoke checks
        run: npm run check:smoke
