<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" fill="none" role="img" aria-label="Hawkeye — the high-precision line-judge for your software supply chain">
  <defs>
    <linearGradient id="gold" x1="560" y1="120" x2="720" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D9B85C"/>
      <stop offset="0.5" stop-color="#B0892F"/>
      <stop offset="1" stop-color="#8A6A22"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="#F6F1E7"/>
  <rect x="40" y="40" width="1200" height="560" rx="20" stroke="url(#gold)" stroke-width="1.5" stroke-opacity="0.4" fill="none"/>

  <!-- medallion, centered -->
  <g transform="translate(556,96) scale(3.5)">
    <circle cx="32" cy="32" r="29" stroke="#154734" stroke-width="2.2" fill="none"/>
    <circle cx="32" cy="32" r="25.2" stroke="url(#gold)" stroke-width="1" fill="none"/>
    <g stroke="#154734" stroke-width="2.4" stroke-linecap="round" fill="none">
      <line x1="32" y1="13" x2="32" y2="19"/>
      <line x1="45" y1="32" x2="51" y2="32"/>
      <line x1="32" y1="45" x2="32" y2="51"/>
      <line x1="13" y1="32" x2="19" y2="32"/>
      <circle cx="32" cy="32" r="12"/>
    </g>
    <circle cx="32" cy="32" r="5" fill="url(#gold)"/>
    <circle cx="30" cy="30" r="1.4" fill="#FBF8F1" fill-opacity="0.92"/>
  </g>

  <g text-anchor="middle">
    <text x="640" y="446" font-family="Georgia,'Times New Roman',serif" font-size="92" font-weight="700" letter-spacing="0.5" fill="#154734">Hawkeye</text>
    <rect x="595" y="468" width="90" height="3" fill="url(#gold)"/>
    <text x="640" y="506" font-family="'Helvetica Neue',Arial,system-ui,sans-serif" font-size="18" font-weight="600" letter-spacing="7" fill="#8A6A22">EVERY INSTALL, CALLED</text>
    <text x="640" y="544" font-family="Georgia,'Times New Roman',serif" font-size="20" font-style="italic" fill="#5E6B5F">The high-precision line-judge for your software supply chain.</text>
  </g>

  <!-- verdict signal row -->
  <g font-family="'Helvetica Neue',Arial,system-ui,sans-serif" font-size="15" font-weight="700" letter-spacing="1" text-anchor="middle">
    <g transform="translate(388,576)"><rect width="168" height="40" rx="20" fill="#FBF8F1" stroke="#1F9D57" stroke-opacity="0.6"/><circle cx="40" cy="20" r="5.5" fill="#1F9D57"/><text x="98" y="25" fill="#23302A">SAFE</text></g>
    <g transform="translate(556,576)"><rect width="168" height="40" rx="20" fill="#FBF8F1" stroke="#C28A1B" stroke-opacity="0.6"/><circle cx="32" cy="20" r="5.5" fill="#C28A1B"/><text x="96" y="25" fill="#23302A">UNKNOWN</text></g>
    <g transform="translate(724,576)"><rect width="168" height="40" rx="20" fill="#FBF8F1" stroke="#B23A3A" stroke-opacity="0.6"/><circle cx="38" cy="20" r="5.5" fill="#B23A3A"/><text x="98" y="25" fill="#23302A">BLOCKED</text></g>
  </g>
</svg>
