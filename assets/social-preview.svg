<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" fill="none" role="img" aria-label="Hawkeye — the high-precision line-judge for your software supply chain">
  <defs>
    <linearGradient id="blue" x1="560" y1="120" x2="720" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4285F4"/>
      <stop offset="1" stop-color="#1A73E8"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="#FFFFFF"/>
  <circle cx="640" cy="232" r="190" stroke="#F1F3F4" stroke-width="2" fill="none"/>

  <!-- mark, centered -->
  <g transform="translate(512,104) scale(4)">
    <g stroke="url(#blue)" stroke-width="2.4" stroke-linecap="round" fill="none">
      <circle cx="32" cy="32" r="25"/>
      <circle cx="32" cy="32" r="11"/>
    </g>
    <g stroke-width="2.6" stroke-linecap="round">
      <line x1="32" y1="9.5"  x2="32" y2="16"   stroke="#34A853"/>
      <line x1="48"  y1="32"  x2="54.5" y2="32" stroke="#FBBC04"/>
      <line x1="32" y1="48"   x2="32" y2="54.5" stroke="#EA4335"/>
      <line x1="9.5" y1="32"  x2="16"  y2="32"  stroke="#4285F4"/>
    </g>
    <circle cx="32" cy="32" r="4.6" fill="url(#blue)"/>
    <circle cx="29.9" cy="29.9" r="1.4" fill="#FFFFFF" fill-opacity="0.92"/>
  </g>

  <g text-anchor="middle" font-family="'Google Sans','Product Sans',Roboto,'Segoe UI',system-ui,Arial,sans-serif">
    <text x="640" y="468" font-size="96" font-weight="700" letter-spacing="-1">
      <tspan fill="#202124">Hawk</tspan><tspan fill="#1A73E8">eye</tspan>
    </text>
    <text x="640" y="510" font-size="20" font-weight="500" letter-spacing="7" fill="#5F6368">EVERY INSTALL, CALLED</text>
    <text x="640" y="546" font-size="19" font-weight="400" letter-spacing="0.2" fill="#5F6368">The high-precision line-judge for your software supply chain.</text>
  </g>

  <!-- verdict signal row -->
  <g font-family="'Google Sans','Product Sans',Roboto,'Segoe UI',system-ui,Arial,sans-serif" font-size="16" font-weight="600" letter-spacing="0.5" text-anchor="middle">
    <g transform="translate(370,584)">
      <rect width="180" height="42" rx="21" fill="#E6F4EA"/>
      <circle cx="42" cy="21" r="5.5" fill="#34A853"/>
      <text x="106" y="27" fill="#1E1F20">SAFE</text>
    </g>
    <g transform="translate(550,584)">
      <rect width="180" height="42" rx="21" fill="#FEF7E0"/>
      <circle cx="34" cy="21" r="5.5" fill="#F9AB00"/>
      <text x="104" y="27" fill="#1E1F20">UNKNOWN</text>
    </g>
    <g transform="translate(730,584)">
      <rect width="180" height="42" rx="21" fill="#FCE8E6"/>
      <circle cx="40" cy="21" r="5.5" fill="#EA4335"/>
      <text x="106" y="27" fill="#1E1F20">BLOCKED</text>
    </g>
  </g>
</svg>
