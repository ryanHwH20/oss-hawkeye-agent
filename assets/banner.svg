<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" fill="none" role="img" aria-label="Hawkeye — the high-precision line-judge for your software supply chain">
  <defs>
    <linearGradient id="gold" x1="96" y1="64" x2="280" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D9B85C"/>
      <stop offset="0.5" stop-color="#B0892F"/>
      <stop offset="1" stop-color="#8A6A22"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" fill="#F6F1E7"/>

  <!-- medallion mark -->
  <g transform="translate(96,64) scale(3)">
    <circle cx="32" cy="32" r="29" stroke="#154734" stroke-width="2.2" fill="none"/>
    <circle cx="32" cy="32" r="25.2" stroke="url(#gold)" stroke-width="1" fill="none"/>
    <g stroke="#154734" stroke-width="2.4" stroke-linecap="round" fill="none">
      <line x1="32" y1="13" x2="32" y2="19"/>
      <line x1="45" y1="32" x2="51" y2="32"/>
      <line x1="32" y1="45" x2="32" y2="51"/>
      <line x1="13" y1="32" x2="19" y2="32"/>
      <circle cx="32" cy="32" r="12"/>
    </g>
    <circle cx="32" cy="32" r="5" fill="url(#gold)"/>
    <circle cx="30" cy="30" r="1.4" fill="#FBF8F1" fill-opacity="0.92"/>
  </g>

  <!-- wordmark -->
  <text x="356" y="168" font-family="Georgia,'Times New Roman',serif" font-size="82" font-weight="700" letter-spacing="0.5" fill="#154734">Hawkeye</text>
  <rect x="358" y="186" width="74" height="3" fill="url(#gold)"/>
  <text x="360" y="216" font-family="'Helvetica Neue',Arial,system-ui,sans-serif" font-size="16" font-weight="600" letter-spacing="6" fill="#8A6A22">EVERY INSTALL, CALLED</text>
  <text x="361" y="250" font-family="Georgia,'Times New Roman',serif" font-size="19" font-style="italic" fill="#5E6B5F">The high-precision line-judge for your software supply chain.</text>

  <!-- verdict signal system, heritage tone -->
  <g font-family="'Helvetica Neue',Arial,system-ui,sans-serif" font-size="14" font-weight="700" letter-spacing="1">
    <g transform="translate(1018,94)"><rect width="188" height="38" rx="19" fill="#FBF8F1" stroke="#1F9D57" stroke-opacity="0.6"/><circle cx="24" cy="19" r="5" fill="#1F9D57"/><text x="40" y="24" fill="#23302A">SAFE</text></g>
    <g transform="translate(1018,140)"><rect width="188" height="38" rx="19" fill="#FBF8F1" stroke="#C28A1B" stroke-opacity="0.6"/><circle cx="24" cy="19" r="5" fill="#C28A1B"/><text x="40" y="24" fill="#23302A">UNKNOWN</text></g>
    <g transform="translate(1018,186)"><rect width="188" height="38" rx="19" fill="#FBF8F1" stroke="#B23A3A" stroke-opacity="0.6"/><circle cx="24" cy="19" r="5" fill="#B23A3A"/><text x="40" y="24" fill="#23302A">BLOCKED</text></g>
  </g>

  <rect x="0" y="317" width="1280" height="3" fill="url(#gold)"/>
</svg>
