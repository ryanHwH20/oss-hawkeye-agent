<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" fill="none" role="img" aria-label="Hawkeye — the high-precision line-judge for your software supply chain">
  <defs>
    <linearGradient id="blue" x1="120" y1="70" x2="280" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4285F4"/>
      <stop offset="1" stop-color="#1A73E8"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="#FFFFFF"/>
  <circle cx="200" cy="160" r="150" stroke="#F1F3F4" stroke-width="2" fill="none"/>

  <!-- mark -->
  <g transform="translate(104,64) scale(3)">
    <g stroke="url(#blue)" stroke-width="2.4" stroke-linecap="round" fill="none">
      <circle cx="32" cy="32" r="25"/>
      <circle cx="32" cy="32" r="11"/>
    </g>
    <g stroke-width="2.6" stroke-linecap="round">
      <line x1="32" y1="9.5"  x2="32" y2="16"   stroke="#34A853"/>
      <line x1="48"  y1="32"  x2="54.5" y2="32" stroke="#FBBC04"/>
      <line x1="32" y1="48"   x2="32" y2="54.5" stroke="#EA4335"/>
      <line x1="9.5" y1="32"  x2="16"  y2="32"  stroke="#4285F4"/>
    </g>
    <circle cx="32" cy="32" r="4.6" fill="url(#blue)"/>
    <circle cx="29.9" cy="29.9" r="1.4" fill="#FFFFFF" fill-opacity="0.92"/>
  </g>

  <!-- wordmark -->
  <text x="356" y="158" font-family="'Google Sans','Product Sans',Roboto,'Segoe UI',system-ui,Arial,sans-serif" font-size="82" font-weight="700" letter-spacing="-1">
    <tspan fill="#202124">Hawk</tspan><tspan fill="#1A73E8">eye</tspan>
  </text>
  <text x="360" y="200" font-family="'Google Sans','Product Sans',Roboto,'Segoe UI',system-ui,Arial,sans-serif" font-size="18" font-weight="500" letter-spacing="6" fill="#5F6368">EVERY INSTALL, CALLED</text>
  <text x="361" y="236" font-family="'Google Sans','Product Sans',Roboto,'Segoe UI',system-ui,Arial,sans-serif" font-size="18" font-weight="400" letter-spacing="0.2" fill="#5F6368">The high-precision line-judge for your software supply chain.</text>

  <!-- verdict signal system (Material status chips) -->
  <g font-family="'Google Sans','Product Sans',Roboto,'Segoe UI',system-ui,Arial,sans-serif" font-size="15" font-weight="600" letter-spacing="0.5">
    <g transform="translate(1006,92)">
      <rect width="200" height="40" rx="20" fill="#E6F4EA"/>
      <circle cx="26" cy="20" r="5" fill="#34A853"/>
      <text x="44" y="25" fill="#1E1F20">SAFE</text>
    </g>
    <g transform="translate(1006,140)">
      <rect width="200" height="40" rx="20" fill="#FEF7E0"/>
      <circle cx="26" cy="20" r="5" fill="#F9AB00"/>
      <text x="44" y="25" fill="#1E1F20">UNKNOWN</text>
    </g>
    <g transform="translate(1006,188)">
      <rect width="200" height="40" rx="20" fill="#FCE8E6"/>
      <circle cx="26" cy="20" r="5" fill="#EA4335"/>
      <text x="44" y="25" fill="#1E1F20">BLOCKED</text>
    </g>
  </g>

  <rect x="0" y="318" width="1280" height="2" fill="#E8EAED"/>
</svg>
