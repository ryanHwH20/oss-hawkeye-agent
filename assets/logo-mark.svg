<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Hawkeye mark">
  <defs>
    <linearGradient id="gold" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D9B85C"/>
      <stop offset="0.5" stop-color="#B0892F"/>
      <stop offset="1" stop-color="#8A6A22"/>
    </linearGradient>
  </defs>
  <!-- medallion: the seal of an indisputable call -->
  <circle cx="32" cy="32" r="29" stroke="#3A2750" stroke-width="2.2" fill="none"/>
  <circle cx="32" cy="32" r="25.2" stroke="url(#gold)" stroke-width="1" fill="none"/>
  <!-- watchful reticle-eye -->
  <g stroke="#3A2750" stroke-width="2.4" stroke-linecap="round" fill="none">
    <line x1="32" y1="13" x2="32" y2="19"/>
    <line x1="45" y1="32" x2="51" y2="32"/>
    <line x1="32" y1="45" x2="32" y2="51"/>
    <line x1="13" y1="32" x2="19" y2="32"/>
    <circle cx="32" cy="32" r="12"/>
  </g>
  <!-- the call -->
  <circle cx="32" cy="32" r="5" fill="url(#gold)"/>
  <circle cx="30" cy="30" r="1.4" fill="#FBF8F1" fill-opacity="0.92"/>
</svg>
